[package]
name = "rust-cv-native"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native Rust computer vision library with multi-backend acceleration"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["computer-vision", "image-processing", "point-cloud", "gpu", "opencv"]
categories = ["computer-vision", "multimedia::images", "science"]

[dependencies]
cv-core = { workspace = true }
cv-hal = { workspace = true }
cv-imgproc = { workspace = true }
cv-features = { workspace = true }
cv-video = { workspace = true }
cv-3d = { workspace = true }
cv-calib3d = { workspace = true }
cv-sfm = { workspace = true }
cv-slam = { workspace = true }
cv-runtime = { workspace = true }
cv-optimize = { workspace = true }
cv-videoio = { workspace = true }
cv-photo = { workspace = true }
cv-viewer = { workspace = true }
cv-io = { workspace = true }
cv-dnn = { workspace = true }
cv-rendering = { workspace = true }
cv-registration = { workspace = true }
cv-plot = { workspace = true }
cv-math = { workspace = true }
cv-geometry2d = { workspace = true }
cv-signal = { workspace = true }
cv-pointcloud = { workspace = true }
cv-distributed = { workspace = true }
cv-eval = { workspace = true }
cv-localization = { workspace = true }
cv-objdetect = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
nalgebra = { workspace = true }
futures = { workspace = true }
wgpu = { workspace = true }
rand = { workspace = true }
bytemuck = { workspace = true }
serde_json = { workspace = true }
geo = { workspace = true }

[features]
default = ["full-precision"]
gpu = ["cv-calib3d/gpu", "cv-features/gpu", "cv-objdetect/gpu"]
full-precision = ["cv-core/full-precision"]
half-precision = ["cv-core/half-precision"]
all-precision = ["cv-core/all-precision"]

[[bench]]
name = "cv_benchmarks"
harness = false
path = "benches/cv_benchmarks.rs"

[[bench]]
name = "async_bridge"
harness = false
path = "benches/async_bridge.rs"

[[bench]]
name = "normals"
harness = false
path = "benches/normals.rs"

[[bench]]
name = "cubecl_vs_wgpu"
harness = false
path = "benches/cubecl_vs_wgpu.rs"

[[bench]]
name = "pipeline_3d"
harness = false
path = "benches/pipeline_3d.rs"

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/hal",
    "crates/imgproc",
    "crates/features",
    "crates/video",
    "crates/videoio",
    "crates/calib3d",
    "crates/photo",
    "crates/sfm",
    "crates/slam",
    "crates/runtime",
    "crates/optimize",
    "crates/python",
    "crates/viewer",
    "crates/io",
    "crates/dnn",
    "crates/3d",
    "crates/rendering",
    "crates/registration",
    "crates/plot",
    "crates/examples",
    "crates/geometry2d",
    "crates/math",
    "crates/signal_proc",
    "crates/pointcloud",
    "crates/distributed",
    "crates/eval",
    "crates/cli",
    "crates/localization",
    "crates/objdetect",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AnshShah3009/RETINA"
homepage = "https://github.com/AnshShah3009/RETINA"
authors = ["Ansh Shah and the RETINA contributors"]

[workspace.dependencies]
# Shared External Dependencies
rayon = "1.12"
approx = "0.5.1"
half = "2.7.1"
nalgebra = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["rayon", "png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "qoi", "pnm", "tga", "hdr"] }
wgpu = "30.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
wide = "1.7.1"
futures = "0.3.34"
thiserror = "2.0.21"
criterion = { version = "0.8.2", default-features = false, features = ["rayon", "cargo_bench_support", "async_tokio"] }
core_affinity = "0.8.3"
ndarray = "0.17.2"
tokio = "1.54.1"
ffmpeg-next = "9.0"
rand = "0.10.3"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pollster = "1.0"
rstar = "0.14.0"
num-traits = "0.2.19"
log = "0.4.35"
tracing = "0.1.44"
libc = "0.2.191"
hashbrown = "0.17"
tempfile = "3.27"
num_cpus = "1.17"
parking_lot = "0.13"
dashmap = "6.2.1"
memmap2 = "0.9.12"
atomic-wait = "1.1.0"
crossbeam-channel = "0.5.17"
v4l = "0.14.0"
geo = "0.33"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
numpy = "0.30.0"
egui = "0.37.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
tract-onnx = "0.23.9"
rustfft = "6.4"

# Internal Workspace Crates
cv-core = { version = "0.2.0", path = "./crates/core" }
cv-hal = { version = "0.2.0", path = "./crates/hal" }
cv-imgproc = { version = "0.2.0", path = "./crates/imgproc" }
cv-features = { version = "0.2.0", path = "./crates/features" }
cv-video = { version = "0.2.0", path = "./crates/video" }
cv-3d = { version = "0.2.0", path = "./crates/3d" }
cv-calib3d = { version = "0.2.0", path = "./crates/calib3d" }
cv-sfm = { version = "0.2.0", path = "./crates/sfm" }
cv-slam = { version = "0.2.0", path = "./crates/slam" }
cv-runtime = { version = "0.2.0", path = "./crates/runtime", features = ["tracing"] }
cv-optimize = { version = "0.2.0", path = "./crates/optimize" }
cv-videoio = { version = "0.2.0", path = "./crates/videoio" }
cv-photo = { version = "0.2.0", path = "./crates/photo" }
cv-io = { version = "0.2.0", path = "./crates/io" }
cv-dnn = { version = "0.2.0", path = "./crates/dnn" }
cv-rendering = { version = "0.2.0", path = "./crates/rendering" }
cv-registration = { version = "0.2.0", path = "./crates/registration" }
cv-plot = { version = "0.2.0", path = "./crates/plot" }
cv-viewer = { version = "0.2.0", path = "./crates/viewer" }
cv-math = { version = "0.2.0", path = "./crates/math" }
cv-geometry2d = { version = "0.2.0", path = "./crates/geometry2d" }
cv-signal = { version = "0.2.0", path = "./crates/signal_proc" }
cv-pointcloud = { version = "0.2.0", path = "./crates/pointcloud" }
cv-distributed = { version = "0.2.0", path = "./crates/distributed", features = ["tracing"] }
cv-eval = { version = "0.2.0", path = "./crates/eval" }
cv-cli = { version = "0.2.0", path = "./crates/cli" }
cv-localization = { version = "0.2.0", path = "./crates/localization" }
cv-objdetect = { version = "0.2.0", path = "./crates/objdetect" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
