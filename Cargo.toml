[package]
name = "rust-cv-native"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Native Rust computer vision library with multi-backend acceleration"

[dependencies]
cv-core = { workspace = true }
cv-hal = { workspace = true }
cv-imgproc = { workspace = true }
cv-features = { workspace = true }
cv-video = { workspace = true }
cv-3d = { workspace = true }
cv-calib3d = { workspace = true }
cv-sfm = { workspace = true }
cv-slam = { workspace = true }
cv-runtime = { workspace = true }
cv-optimize = { workspace = true }
cv-videoio = { workspace = true }
cv-photo = { workspace = true }
cv-scientific = { workspace = true }
cv-viewer = { workspace = true }
cv-io = { workspace = true }
cv-dnn = { workspace = true }
cv-rendering = { workspace = true }
cv-registration = { workspace = true }
cv-plot = { workspace = true }
cv-math = { workspace = true }
cv-geometry2d = { workspace = true }
cv-signal = { workspace = true }
cv-pointcloud = { workspace = true }
cv-distributed = { workspace = true }
cv-eval = { workspace = true }
cv-localization = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
image = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
nalgebra = { workspace = true }
futures = { workspace = true }
wgpu = { workspace = true }
rand = { workspace = true }
bytemuck = { workspace = true }

[features]
default = ["full-precision"]
gpu = ["cv-calib3d/gpu", "cv-features/gpu"]
full-precision = ["cv-core/full-precision"]
half-precision = ["cv-core/half-precision"]
all-precision = ["cv-core/all-precision"]

[[bench]]
name = "cv_benchmarks"
harness = false
path = "benches/cv_benchmarks.rs"

[[bench]]
name = "async_bridge"
harness = false
path = "benches/async_bridge.rs"

[[bench]]
name = "normals"
harness = false
path = "benches/normals.rs"

[[bench]]
name = "cubecl_vs_wgpu"
harness = false
path = "benches/cubecl_vs_wgpu.rs"

[[bench]]
name = "pipeline_3d"
harness = false
path = "benches/pipeline_3d.rs"

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/hal",
    "crates/imgproc",
    "crates/features",
    "crates/video",
    "crates/videoio",
    "crates/calib3d",
    "crates/photo",
    "crates/sfm",
    "crates/slam",
    "crates/runtime",
    "crates/optimize",
    "crates/scientific",
    "crates/python",
    "crates/viewer",
    "crates/io",
    "crates/dnn",
    "crates/3d",
    "crates/rendering",
    "crates/registration",
    "crates/plot",
    "crates/examples",
    "crates/geometry2d",
    "crates/math",
    "crates/signal_proc",
    "crates/pointcloud",
    "crates/distributed",
    "crates/eval",
    "crates/cli",
    "crates/localization",
]

[workspace.dependencies]
# Shared External Dependencies
rayon = "1.12"
approx = "0.5.1"
half = "2.7.1"
nalgebra = "0.35.0"
image = { version = "0.25.10", default-features = false, features = ["rayon", "png", "jpeg", "gif", "webp", "tiff", "bmp", "ico", "qoi", "pnm", "tga", "hdr"] }
wgpu = "28.0.0"
bytemuck = { version = "1.25.2", features = ["derive"] }
wide = "0.7.33"
futures = "0.3.34"
thiserror = "2.0.21"
criterion = { version = "0.5", default-features = false, features = ["rayon", "cargo_bench_support", "async_tokio"] }
core_affinity = "0.8.3"
ndarray = "0.17.2"
tokio = "1.54.1"
ffmpeg-next = "9.0"
rand = "0.9.3"
rand_distr = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
pollster = "0.4.0"
rstar = "0.12.2"
num-traits = "0.2.19"
log = "0.4.35"
tracing = "0.1.44"
libc = "0.2.191"
hashbrown = "0.17"
tempfile = "3.27"
num_cpus = "1.17"
parking_lot = "0.13"
dashmap = "6.2.1"
memmap2 = "0.9.12"
atomic-wait = "1.1.0"
crossbeam-channel = "0.5.17"
v4l = "0.14.0"
geo = "0.33"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
numpy = "0.30.0"
egui = "0.33.3"
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
tract-onnx = "0.23.9"
rustfft = "6.4"

# Internal Workspace Crates
cv-core = { path = "./crates/core" }
cv-hal = { path = "./crates/hal" }
cv-imgproc = { path = "./crates/imgproc" }
cv-features = { path = "./crates/features" }
cv-video = { path = "./crates/video" }
cv-3d = { path = "./crates/3d" }
cv-calib3d = { path = "./crates/calib3d" }
cv-sfm = { path = "./crates/sfm" }
cv-slam = { path = "./crates/slam" }
cv-runtime = { path = "./crates/runtime", features = ["tracing"] }
cv-optimize = { path = "./crates/optimize" }
cv-scientific = { path = "./crates/scientific" }
cv-videoio = { path = "./crates/videoio" }
cv-photo = { path = "./crates/photo" }
cv-io = { path = "./crates/io" }
cv-dnn = { path = "./crates/dnn" }
cv-rendering = { path = "./crates/rendering" }
cv-registration = { path = "./crates/registration" }
cv-plot = { path = "./crates/plot" }
cv-viewer = { path = "./crates/viewer" }
cv-math = { path = "./crates/math" }
cv-geometry2d = { path = "./crates/geometry2d" }
cv-signal = { path = "./crates/signal_proc" }
cv-pointcloud = { path = "./crates/pointcloud" }
cv-distributed = { path = "./crates/distributed", features = ["tracing"] }
cv-eval = { path = "./crates/eval" }
cv-cli = { path = "./crates/cli" }
cv-localization = { path = "./crates/localization" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
