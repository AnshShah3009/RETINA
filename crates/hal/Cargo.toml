[package]
name = "cv-hal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Hardware Abstraction Layer for multi-backend acceleration"

[dev-dependencies]
criterion = { workspace = true }
approx = { workspace = true }
image = { workspace = true }
cv-core = { workspace = true }
half = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
futures = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
ndarray-npy = { version = "0.10", default-features = false }
ndarray = { workspace = true }

[dependencies]
cv-core = { workspace = true }
rayon = { workspace = true }
nalgebra = { workspace = true }
wide = { workspace = true }
thiserror = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
futures = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["sync"] }
rstar = { workspace = true }
hashbrown = { workspace = true }
tracing = { workspace = true }
cubecl = { version = "0.11.3", optional = true, features = ["wgpu"] }
cubecl-wgpu = { version = "0.11.3", optional = true }
# Already in the tree under `cubecl`; named directly only for `StreamId`, which
# `cubecl` does not re-export (its `environment` path is shadowed).
cubecl-environment = { version = "0.11.3", optional = true, default-features = false }
cubecl-cuda = { version = "0.11.3", optional = true }

[features]
default = ["full-precision"]
cpu = []
simd = []
cuda = []
tensorrt = []
directml = []
webgpu = []
mlx = []
cubecl = ["dep:cubecl", "dep:cubecl-wgpu", "dep:cubecl-environment"]
wgpu_backend = []
full-precision = ["cv-core/full-precision"]
half-precision = ["cv-core/half-precision"]
all-precision = ["full-precision", "half-precision"]

[[bench]]
name = "gpu_transfer"
harness = false

[[bench]]
name = "gpu_ops"
harness = false

[[bench]]
name = "cubecl_kernels"
harness = false
required-features = ["cubecl"]
