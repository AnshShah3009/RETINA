[package]
name = "cv-features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Feature detection and description algorithms"

[dependencies]
cv-core = { workspace = true }
cv-imgproc = { workspace = true }
cv-hal = { workspace = true }
cv-calib3d = { workspace = true }
cv-runtime = { workspace = true, optional = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
image = { workspace = true }
rand = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
tracing = { workspace = true }

# Optional GPU support
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = ["runtime"]
runtime = ["dep:cv-runtime"]
gpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
pollster = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "features_cpu"
harness = false
