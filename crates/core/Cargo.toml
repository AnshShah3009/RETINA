[package]
name = "cv-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Core types for computer vision"

[dependencies]
nalgebra = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
wide = { workspace = true }
thiserror = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
num-traits = { version = "0.2", default-features = false }
bytemuck = { workspace = true, features = ["derive"] }
# `bytemuck` makes `f16`/`bf16` `Pod`, which every GPU upload and kernel needs.
half = { version = "2.4", features = ["num-traits", "serde", "bytemuck"], optional = true }

[features]
default = ["full-precision"]
full-precision = []
half-precision = ["half"]
all-precision = ["full-precision", "half-precision"]
