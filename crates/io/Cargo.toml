[package]
name = "cv-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "3D file format I/O for point clouds and meshes (PLY, OBJ, STL, PCD)"

[dependencies]
cv-core = { workspace = true }
nalgebra = { workspace = true }
las = { version = "0.11", optional = true, features = ["laz"] }
gltf = { version = "1.4", optional = true }

[features]
default = []
las = ["dep:las"]
gltf = ["dep:gltf"]

[dev-dependencies]
# Tests check that loaded meshes behave in the cv-3d algorithms.
cv-3d = { workspace = true }
