[package]
name = "cv-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "cv_native"
# `rlib` alongside `cdylib`: a cdylib alone produces no linkable Rust
# library, so `crates/python/tests/*.rs` could not name `cv_native` at all
# (probe: "error[E0433]: cannot find module or crate `cv_native` in this scope"),
# which is how a crate with 96 public Python items ended up with 0 tests.
# `cargo build -p cv-python` still produces the same `libcv_native.so`.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py37"] }
numpy = { workspace = true }
cv-core = { workspace = true }
cv-features = { workspace = true }
cv-3d = { workspace = true }
cv-scientific = { workspace = true }
cv-runtime = { workspace = true }
cv-slam = { workspace = true }
cv-videoio = { workspace = true }
cv-dnn = { workspace = true }
cv-optimize = { workspace = true }
cv-photo = { workspace = true }
cv-imgproc = { workspace = true }
nalgebra = { workspace = true }
rustfft = { workspace = true }
image = { workspace = true }

[features]
default = []
# Enables `tests/binding_contract.rs`, which links PyO3 against CPython and so
# needs `CV_PYTHON_LINK_LIB=1` at build time. Off by default because the shipped
# cdylib must not depend on a particular libpython.
python-link-tests = []
