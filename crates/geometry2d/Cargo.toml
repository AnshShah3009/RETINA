[package]
name = "cv-geometry2d"
version = "0.1.0"
edition = "2024"

[dependencies]
geo = { workspace = true }
# Shewchuk's adaptive exact orient2d / incircle; already in the tree via `geo`.
robust = "1.2"
# Polygon overlay with winding-number fill rules; already in the tree via `geo`
# (which uses it for its boolean ops). `buffer_polygon` resolves its raw offset
# rings with the positive fill rule, as GEOS does.
i_overlay = { version = "9.1", default-features = false }
