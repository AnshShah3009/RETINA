[package]
name = "cv-geometry2d"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
geo = { workspace = true }
# Shewchuk's adaptive exact orient2d / incircle; already in the tree via `geo`.
robust = "1.2"
# Polygon overlay with winding-number fill rules; already in the tree via `geo`
# (which uses it for its boolean ops). `buffer_polygon` resolves its raw offset
# rings with the positive fill rule, as GEOS does.
i_overlay = { version = "4.5", default-features = false }
