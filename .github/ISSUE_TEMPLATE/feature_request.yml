name: Feature request
description: A missing function, API improvement or new capability.
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        For anything sizeable, agreeing on the design here first saves rework. See CONTRIBUTING.md,
        "Adding a new operation".
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what is missing or awkward today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Function signatures or usage sketch.
      render: rust
  - type: input
    id: reference
    attributes:
      label: Reference equivalent
      description: The OpenCV / Open3D / SciPy / Matplotlib function this mirrors, if any.
  - type: textarea
    id: testing
    attributes:
      label: How it would be tested
      description: Reference values, properties, or datasets that would show it works.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - Yes, with guidance
        - Yes
        - No
    validations:
      required: true
