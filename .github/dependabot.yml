version: 2
updates:
  # Rust dependencies. Grouped so a week's updates arrive as one pull request,
  # which CI then checks like any other.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-and-patch:
        update-types: ["minor", "patch"]
      # geo depends on i_overlay; our direct i_overlay must stay on the version
      # geo uses, so the two only move together.
      geo:
        patterns: ["geo", "geo-types", "i_overlay"]
    ignore:
      - dependency-name: "i_overlay"
        update-types: ["version-update:semver-major"]
    labels: ["dependencies"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]
