name: Build and Test

on:
  push:
    branches: [ master, develop, research/cubecl ]
    paths:
      - '**/*.rs'
      # Shaders are compiled into the crates with include_str!, and the
      # .npy files are test fixtures; changes to either change results.
      - '**/*.wgsl'
      - '**/*.npy'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ master, develop, research/cubecl ]
    paths:
      - '**/*.rs'
      # Shaders are compiled into the crates with include_str!, and the
      # .npy files are test fixtures; changes to either change results.
      - '**/*.wgsl'
      - '**/*.npy'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/build.yml'
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-linux:
    name: CI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Check half-precision feature
      # Nothing else builds this feature, and it went uncompilable unnoticed:
      # a bf16 shader it include_str!'d did not exist.
      run: cargo check -p cv-hal --features half-precision

    - name: Test optional features
      # Off by default, so the workspace test run never compiles them: the
      # edition-2024 migration once left two compile errors in `las`, and
      # nothing else enables cv-objdetect's `gpu` marker scan.
      run: cargo test -p cv-io -p cv-objdetect --features cv-io/las,cv-io/gltf,cv-objdetect/gpu

    - name: Check CubeCL feature
      # The CubeCL kernels, their tests and benches are behind a feature
      # nothing else builds; this runner has no GPU, so macOS runs the tests.
      run: cargo check -p cv-hal --features cubecl --all-targets

    - name: No compiler warnings
      # 66 warnings had piled up, and among them were real defects: two
      # different CharucoBoard types behind one ambiguous re-export, a test
      # attribute separated from its test, ignored Results, and bench code
      # written against a module that never existed.
      run: |
        cargo check --workspace --all-targets --message-format short 2>&1 | tee check.log
        ! grep -E '^[^ ]+:[0-9]+:[0-9]+: warning' check.log

    - name: Build examples
      # `cargo build --workspace` does not build examples, so without this
      # `example_smoke` silently skipped every example: the guard it has always
      # had ("skipping: not built") turned a whole class of failures into a
      # green run. That is how a GPU ORB path that panicked on its first call
      # and a viewer example that hung for 120s both reached CI unnoticed.
      run: cargo build --workspace --examples

    - name: Run clippy
      run: cargo clippy --workspace --lib -- -W clippy::all

    - name: Run tests
      run: cargo nextest run --workspace --no-fail-fast

    - name: Run doctests
      # `cargo nextest` deliberately does not support doctests, so the 32 doc
      # examples in this workspace were never executed by CI at all - the same
      # shape of gap the "Build examples" step above records for examples. One
      # was already broken and invisible: a mathematical formula written in an
      # indented block in `gaussian_splatting::types`, which rustdoc compiles as
      # Rust, failing on the `·` in `a·dx²`. For a library whose documentation is
      # the first thing a user copies, a doc example that has never been run is
      # not documentation.
      run: cargo test --doc --workspace

  deny:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Check advisories, bans, licences and sources
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        # Every feature, so optional backends (CubeCL, MLX, FFmpeg) are checked too.
        command: check
        arguments: --all-features

  ci-macos:
    # The only runner with a GPU (Metal), so this job runs the GPU tests and
    # examples. Formatting, clippy, warnings and doctests are checked on Linux.
    name: CI (macOS)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Set up Python
      # cv-python's PyO3 build needs an interpreter.
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        key: macos-v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Build examples
      # tests/example_smoke.rs runs them; only here do their GPU paths get a GPU.
      run: cargo build --workspace --examples

    - name: Run tests (Metal GPU)
      run: cargo nextest run --workspace --no-fail-fast

    - name: Test MLX context
      # `mlx` only changes crates/hal/src/mlx.rs, so cv-hal's tests cover it.
      run: cargo test -p cv-hal --features mlx

    - name: Test CubeCL kernels (Metal)
      # The only CI runner with a GPU, so the only place the CubeCL kernels
      # (feature `cubecl`) run in CI.
      run: cargo test -p cv-hal --features cubecl --test cubecl_kernels_test

    - name: Test f16/bf16 GPU kernels (Metal)
      # Behind `half-precision`, which no other step tests, and GPU-only.
      run: cargo test -p cv-hal --features half-precision --test gpu_half_kernels --test gpu_threshold_f16
