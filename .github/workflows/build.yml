name: Build and Test

on:
  push:
    branches: [ master, develop ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ master, develop ]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci-linux:
    name: CI (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Build workspace
      run: cargo build --workspace

    - name: Build examples
      # `cargo build --workspace` does not build examples, so without this
      # `example_smoke` silently skipped every example: the guard it has always
      # had ("skipping: not built") turned a whole class of failures into a
      # green run. That is how a GPU ORB path that panicked on its first call
      # and a viewer example that hung for 120s both reached CI unnoticed.
      run: cargo build --workspace --examples

    - name: Run clippy
      run: cargo clippy --workspace --lib -- -W clippy::all

    - name: Run tests
      run: cargo nextest run --workspace

    - name: Run doctests
      # `cargo nextest` deliberately does not support doctests, so the 32 doc
      # examples in this workspace were never executed by CI at all - the same
      # shape of gap the "Build examples" step above records for examples. One
      # was already broken and invisible: a mathematical formula written in an
      # indented block in `gaussian_splatting::types`, which rustdoc compiles as
      # Rust, failing on the `·` in `a·dx²`. For a library whose documentation is
      # the first thing a user copies, a doc example that has never been run is
      # not documentation.
      run: cargo test --doc --workspace

  ci-macos:
    name: CI (macOS)
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: clippy

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@v2
      with:
        key: macos-v1

    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest

    - name: Build workspace (CPU backend)
      run: cargo build --workspace --features cpu
    - name: Build examples
      run: cargo build --workspace --features cpu --examples

    - name: Build workspace (MLX backend)
      run: cargo build --workspace --features mlx
    - name: Build examples
      run: cargo build --workspace --features mlx --examples

    - name: Run clippy
      run: cargo clippy --workspace --lib -- -W clippy::all

    - name: Run tests (CPU backend)
      run: cargo nextest run --workspace --features cpu

    - name: Run tests (MLX backend)
      run: cargo nextest run --workspace --features mlx
